name: Build RootFS (Ubuntu + Lomiri)

# 在 ubuntu-sheng 基础上加一个 Lomiri 变体，完全自包含，不改动现有 workflow/scripts。
#
# Lomiri = 原 Ubuntu Touch 的 Unity8。显示栈是 Mir + Qt/QML，Mir 直接走 DRM/KMS，
# 所以不需要 libhybris / Android vendor 层，能在纯 mainline 内核（sheng 的内核）上跑。
# 这正是它区别于 Sailfish / Droidian 的地方。
#
# 输出 rootfs.tar.zst：解到 fydeos 分区(sda30)，U-Boot 用 extlinux.conf 引导。

on:
  workflow_dispatch:
    inputs:
      ubuntu_series:
        description: 'Ubuntu 系列（26.10 = stonking；26.04 = resolute）'
        type: string
        default: 'stonking'
      extra_packages:
        description: '额外安装的包（空格分隔）'
        type: string
        default: ''

jobs:
  build:
    name: Assemble Ubuntu + Lomiri RootFS
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y -qq debootstrap zstd

      - name: Fetch device firmware (sheng-firmware)
        run: |
          set -euxo pipefail
          # 仓库里的 firmware-xiaomi-sheng/ 只有 DEBIAN 骨架（见 README），
          # 真固件在上游：ath12k/WCN7850、QCA 蓝牙、Cirrus DSP、novatek/nanosic、指纹
          git clone --depth 1 --branch master https://github.com/ianchb/sheng-firmware firmware-src
          du -sh firmware-src
          ls firmware-src

      - name: Download linux-xiaomi-sheng deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p debs
          # sda29 上的 Image 就是这个内核，模块版本必须和它一致，否则触摸/音频等全废
          TAG=$(gh release list --repo ianchb/sm8550-mainline --limit 1 --json tagName --jq '.[0].tagName')
          echo "内核 release: $TAG"
          gh release download "$TAG" --repo ianchb/sm8550-mainline \
            --pattern 'linux-xiaomi-sheng*.deb' --clobber --dir debs
          ls -lh debs/

      - name: Debootstrap Ubuntu arm64 (main+universe)
        run: |
          set -euxo pipefail
          # universe 是必须的：lomiri 在 universe 里
          # debootstrap 按 /usr/share/debootstrap/scripts/<suite> 查脚本，runner
          # 上的 debootstrap 比 stonking 早，没有对应脚本 → 用通用脚本兜底
          S="${{ inputs.ubuntu_series }}"
          echo "--- debootstrap scripts 目录 ---"
          ls /usr/share/debootstrap/scripts | tr '\n' ' '; echo
          if [ ! -e "/usr/share/debootstrap/scripts/$S" ]; then
            F=gutsy
            [ -e "/usr/share/debootstrap/scripts/$F" ] || F=$(ls /usr/share/debootstrap/scripts | sort | tail -1)
            echo "suite '$S' 无脚本 → 用 '$F' 兜底"
            sudo ln -sf "$F" "/usr/share/debootstrap/scripts/$S"
          fi
          sudo debootstrap \
            --arch=arm64 \
            --components=main,universe \
            --include=ca-certificates,gnupg,systemd,systemd-sysv,sudo,locales,tzdata,kmod,udev \
            "$S" \
            "$PWD/rootfs" \
            http://ports.ubuntu.com/ubuntu-ports
          echo "=== base built ==="
          sudo du -sh "$PWD/rootfs"
          echo "--- rootfs 属主 ---"
          ls -ld "$PWD/rootfs"
          # chroot 的 / 必须是 root 所有。否则 systemd 的工具会报
          # "Detected unsafe path transition / (owned by 1001) → /run ..."，
          # 凡是 postinst 里调 systemctl 的包统统 exit 73。
          sudo chown root:root "$PWD/rootfs"
          sudo chmod 755 "$PWD/rootfs"

      - name: Mount chroot
        run: |
          set -euxo pipefail
          R="$PWD/rootfs"
          for d in dev dev/pts proc sys run tmp; do sudo mkdir -p "$R/$d"; done
          sudo mount --bind /dev     "$R/dev"
          sudo mount --bind /dev/pts "$R/dev/pts"
          sudo mount -t proc  proc   "$R/proc"
          sudo mount -t sysfs sysfs  "$R/sys"
          sudo mount -t tmpfs tmpfs  "$R/run"
          # 26.10 的开发版仓库走 ports
          sudo mkdir -p "$R/etc/apt"
          printf '%s\n' \
            "deb http://ports.ubuntu.com/ubuntu-ports ${{ inputs.ubuntu_series }} main universe" \
            "deb http://ports.ubuntu.com/ubuntu-ports ${{ inputs.ubuntu_series }}-updates main universe" \
            "deb http://ports.ubuntu.com/ubuntu-ports ${{ inputs.ubuntu_series }}-security main universe" \
            | sudo tee "$R/etc/apt/sources.list" >/dev/null
          # debootstrap 写出的 resolv.conf 是指向 /run/systemd/resolve/... 的悬空
          # 符号链接，cp 不会穿透写，先删掉
          sudo rm -f "$R/etc/resolv.conf"
          sudo cp -L /etc/resolv.conf "$R/etc/resolv.conf"
          # 仓库里已有的设备素材
          [ -d alsa-xiaomi-sheng ]     && { sudo mkdir -p "$R/usr/share/alsa/ucm2"; sudo cp -a alsa-xiaomi-sheng/. "$R/usr/share/alsa/ucm2/"; } || true
          [ -d firmware-src ] && {
            sudo mkdir -p "$R/usr/lib/firmware"
            sudo cp -a firmware-src/. "$R/usr/lib/firmware/"
            sudo rm -rf "$R/usr/lib/firmware/.git" "$R/usr/lib/firmware/.github" "$R/usr/lib/firmware/.gitignore"
            echo "固件文件数: $(sudo find "$R/usr/lib/firmware" -type f | wc -l)"
          } || echo "!! 没有 firmware-src，固件会缺失"
          [ -d sheng-sensors-files ]   && sudo cp -a sheng-sensors-files/. "$R/" || true
          [ -d sheng-devauth ]         && sudo cp -a sheng-devauth/. "$R/" || true
          # 这些包里都带 DEBIAN/，照抄会把骨架目录铺到根上
          sudo rm -rf "$R/DEBIAN" "$R/usr/lib/firmware/DEBIAN"

      - name: Write in-chroot script
        run: |
          set -euxo pipefail
          mkdir -p "$PWD/chroot"
          cat > "$PWD/chroot/setup.sh" <<'EOS'
          #!/bin/bash
          # Lomiri 安装与系统配置。在 chroot 内以 root 执行。
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          cd /
          # 宿主 ls -ld 看 rootfs 是 root:root，但 chroot 里 stat / 报 1001:1001。
          # systemd 的 CHASE_SAFE 就是拿这个 uid 做基准，基准不是 0 就报
          # "unsafe path transition / (owned by 1001) → /run ..."，
          # 于是 openvpn/usermetricsservice/lomiri 这些 postinst 全部 exit 73。
          # 检查在 chroot 内做，所以在 chroot 内纠正。
          chown 0:0 / && chmod 755 /
          for d in /run /tmp /var /var/lib /usr /etc; do chown 0:0 "$d" 2>/dev/null || true; done
          echo "cwd=$(pwd) 根目录属主=$(stat -c '%u:%g' /) inode=$(stat -c '%i' /)"
          # chroot 里不要真去启服务：policy-rc.d 返回 101 让 invoke-rc.d 直接放弃
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d

          apt-get update

          # dbus 和 file 必须赶在 lomiri 之前：NetworkManager 的 postinst 要调 `file`，
          # 而它和 usermetricsservice 都要连 system bus。缺这两样时 configure 阶段
          # 会成片 exit 73，看起来像 lomiri 装不上，其实跟 lomiri 无关。
          apt-get install -y --no-install-recommends dbus file
          mkdir -p /run/dbus
          dbus-daemon --system --fork || true

          echo "=== 可用的 lomiri 相关包 ==="
          apt-cache search lomiri | head -40 || true
          apt-cache policy lomiri || true

          echo "=== 安装 Lomiri ==="
          # lomiri 只是 shell 本体；lomiri-desktop-session 才提供会话入口：
          #   /usr/bin/lomiri-session、/usr/lib/systemd/user/lomiri.service、
          #   /usr/share/wayland-sessions/lomiri.desktop
          # 少了它 systemd 会一直抱怨 lomiri.service 不存在，greetd 也无从拉起。
          LOMPKG="lomiri lomiri-desktop-session"
          if ! apt-get install -y --no-install-recommends $LOMPKG; then
            echo "=== 第一次失败：修完 dpkg 状态再试一次 ==="
            dpkg --configure -a || true
            apt-get install -f -y --no-install-recommends || true
            apt-get install -y --no-install-recommends $LOMPKG || {
              echo "=== 安装失败，诊断 ==="
              apt-cache policy lomiri lomiri-desktop-session || true
              dpkg -l | grep -Ev '^ii' | head -30 || true
              exit 1
            }
          fi
          for p in lomiri lomiri-desktop-session; do
            dpkg -s "$p" | grep -q 'Status: install ok installed' \
              || { echo "$p 未处于已配置状态"; exit 1; }
          done
          ls -l /usr/bin/lomiri-session /usr/share/wayland-sessions/lomiri.desktop

          # 其余都是尽力而为，缺哪个都不该让整次构建挂掉
          apt-get install -y --no-install-recommends \
            lomiri-system-settings lomiri-desktop lomiri-greeter \
            debian-lomiri-default-settings \
            greetd network-manager \
            pipewire pipewire-pulse wireplumber openssh-server \
            locales tzdata kmod fonts-noto-cjk \
            || echo "部分辅助包安装失败（不致命，继续）"

          echo "=== 内核包 ==="
          if compgen -G '/root/*.deb' >/dev/null; then
            dpkg -i /root/*.deb || apt-get -f install -y --no-install-recommends || true
            echo "--- /lib/modules ---"
            ls /lib/modules || true
            rm -f /root/*.deb   # 259M，装完就删，别打进 tarball
          else
            echo "没有内核 deb：模块缺失（显示能起，触摸/音频/电量大半不行）"
          fi

          echo "=== 用户 ==="
          id ubuntu >/dev/null 2>&1 || useradd -m -s /bin/bash ubuntu
          for g in sudo video input audio render plugdev netdev; do
            if getent group "$g" >/dev/null; then usermod -aG "$g" ubuntu; fi
          done
          echo 'ubuntu:ubuntu' | chpasswd
          printf '%s\n' 'ubuntu ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ubuntu
          chmod 0440 /etc/sudoers.d/ubuntu
          echo sheng > /etc/hostname
          grep -q sheng /etc/hosts || printf '%s\n' '127.0.1.1 sheng' >> /etc/hosts

          echo "=== locale ==="
          sed -i -E 's/^# *(en_US|zh_CN)\.UTF-8/\1.UTF-8/' /etc/locale.gen || true
          locale-gen || true
          printf 'LANG=en_US.UTF-8\n' > /etc/default/locale

          echo "=== greetd 启动 Lomiri 会话 ==="
          # 用 lomiri-session 而不是 lomiri：前者负责拉起 systemd user session
          # 和 lomiri.service，后者只是 shell 本体。
          SESSION=/usr/bin/lomiri-session
          [ -x "$SESSION" ] || { echo "缺少 $SESSION"; exit 1; }
          mkdir -p /etc/greetd
          printf '%s\n' \
            '[terminal]' \
            'vt = 1' \
            '' \
            '[default_session]' \
            'command = "/usr/bin/lomiri-session"' \
            'user = "ubuntu"' \
            > /etc/greetd/config.toml
          cat /etc/greetd/config.toml

          # getty 会占住 tty1，和 greetd 的 vt = 1 打架（上一次真机就卡在这：
          # 屏幕上是 tty1 的登录提示，Lomiri 起不来）
          systemctl mask getty@tty1.service || true
          systemctl set-default graphical.target || true

          systemctl enable greetd.service   || true
          systemctl enable ssh.service      || true
          systemctl enable NetworkManager.service || true

          # 持久化 journal + 一次性诊断单元。出问题时不用连键盘，
          # 直接回 TWRP 读 /diag.txt 就行。
          mkdir -p /var/log/journal
          cat > /etc/systemd/system/diag.service <<'EOU'
          [Unit]
          Description=boot diagnostics
          After=graphical.target greetd.service
          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'sleep 25; { echo "== date =="; date; echo "== failed units =="; systemctl --no-pager --failed; echo "== greetd =="; systemctl --no-pager status greetd.service; echo "== drm =="; ls -l /dev/dri; echo "== sessions =="; loginctl list-sessions; echo "== journal =="; journalctl -b -n 250 --no-pager; } > /diag.txt 2>&1'
          [Install]
          WantedBy=multi-user.target
          EOU
          sed -i 's/^          //' /etc/systemd/system/diag.service
          systemctl enable diag.service || true

          echo "=== 触摸需要的 uinput ==="
          mkdir -p /etc/modules-load.d
          echo uinput > /etc/modules-load.d/uinput.conf

          echo "=== 去掉 snap（沿用本仓库的 snap-free 立场） ==="
          systemctl disable --now snapd.service snapd.socket 2>/dev/null || true
          apt-get purge -y snapd 2>/dev/null || true

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          echo "=== setup done ==="
          EOS
          # heredoc 带缩进，去掉每行前导空格
          sed -i 's/^          //' "$PWD/chroot/setup.sh"
          chmod +x "$PWD/chroot/setup.sh"
          head -5 "$PWD/chroot/setup.sh"

      - name: "[chroot] Run setup"
        run: |
          set -euxo pipefail
          sudo cp "$PWD/chroot/setup.sh" "$PWD/rootfs/setup.sh"
          sudo mkdir -p "$PWD/rootfs/root"
          sudo cp debs/*.deb "$PWD/rootfs/root/" 2>/dev/null || true
          # chroot 不改变 cwd！不先 cd / 的话进程 cwd 还指着宿主工作目录
          # (uid 1001)，systemd-tmpfiles 做相对路径 canonicalization 时会报
          # "Detected unsafe path transition / (owned by 1001) → /run ..."，
          # 于是 openvpn/usermetricsservice 这类 postinst 统统 exit 73。
          sudo chroot "$PWD/rootfs" /bin/bash -c 'cd / && exec /bin/bash /setup.sh'
          sudo rm -f "$PWD/rootfs/setup.sh"

      - name: "[chroot] Extra packages"
        if: ${{ inputs.extra_packages != '' }}
        run: |
          set -euxo pipefail
          sudo cp "$PWD/rootfs/etc/resolv.conf" /tmp/rc.bak || true
          sudo chroot "$PWD/rootfs" /bin/bash -c "cd / && export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y --no-install-recommends ${{ inputs.extra_packages }}"

      - name: Verify
        run: |
          set -euxo pipefail
          R="$PWD/rootfs"
          echo "=== init ==="
          sudo chroot "$R" /bin/bash -c 'cd / && readlink -f /sbin/init; ls -l /usr/bin/lomiri-session /usr/share/wayland-sessions/lomiri.desktop /etc/systemd/system/diag.service /etc/systemd/system/display-manager.service; echo "--- getty@tty1 ---"; readlink -f "/etc/systemd/system/getty@tty1.service"; echo "--- greetd ---"; cat /etc/greetd/config.toml; echo "--- modules ---"; ls /lib/modules; echo "--- firmware ---"; ls /usr/lib/firmware | head -20; echo "固件文件数: $(find /usr/lib/firmware -type f | wc -l)"' || true
          echo "=== size ==="
          # proc 已挂上，表项随时消失会让 du 返回 1，别让 set -e 抓走
          sudo du -sh --exclude=proc --exclude=sys --exclude=dev "$R" 2>/dev/null || true

      - name: Unmount
        if: always()
        run: |
          R="$PWD/rootfs"
          for m in run sys proc dev/pts dev; do sudo umount -lf "$R/$m" 2>/dev/null || true; done

      - name: Pack
        run: |
          set -euxo pipefail
          cd "$PWD/rootfs"
          sudo tar -cf ../rootfs.tar .
          cd ..
          sudo chown "$(id -u):$(id -g)" rootfs.tar
          zstd -T0 -12 -o rootfs.tar.zst rootfs.tar
          rm -f rootfs.tar
          ls -lh rootfs.tar.zst

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-ubuntu-lomiri-${{ inputs.ubuntu_series }}
          path: rootfs.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
